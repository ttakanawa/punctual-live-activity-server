name: Manual deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated deployment to update
        required: true
        type: choice
        options:
          - development
          - production
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - run: npm ci
      - run: cargo fmt --check && cargo test --locked
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install worker-build --version 0.9.0 --locked
      - run: npm run build && npm test && npm run check:contract
      - name: Deploy code, configuration and APNs secret atomically
        run: node scripts/deploy.mjs
        env:
          DEPLOY_TARGET: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_ID_PREFIX: ${{ vars.APPLE_APP_ID_PREFIX }}
          APP_ATTEST_ENVIRONMENT: ${{ vars.APP_ATTEST_ENVIRONMENT }}
          APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
          ATTEST_ALLOWED_CATEGORIES: ${{ vars.ATTEST_ALLOWED_CATEGORIES }}
          ATTEST_ALLOWED_BUNDLE_VERSIONS: ${{ vars.ATTEST_ALLOWED_BUNDLE_VERSIONS }}
