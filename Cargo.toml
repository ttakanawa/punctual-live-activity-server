[package]
name = "punctual-end-api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ciborium = "0.2"
hex = "0.4"
httpdate = "1"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
x509-parser = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9"
wasm-bindgen = "0.2"
js-sys = "0.3"
futures-util = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rcgen = "0.14"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
codegen-units = 1
